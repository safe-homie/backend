services:
    server:
        build: .
        ports:
            - "8000:8000"
        environment:
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_DB=${DB_NAME}
            - MODE=production
        depends_on:
            timescaledb:
                condition: service_healthy
            mosquitto-broker:
                condition: service_started
        networks:
            - smart-homie-net

    timescaledb:
        image: timescale/timescaledb:2.18.1-pg17
        restart: always
        environment:
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_DB=${DB_NAME}
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
            interval: 5s
            retries: 5
        ports:
            - "5432:5432"
        volumes:
            - pg-data:/var/lib/postgresql/data
        networks:
            - smart-homie-net

    mosquitto-broker:
        image: eclipse-mosquitto:2.0.21
        ports:
            - "1883:1883"
        volumes:
            - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
        networks:
            - smart-homie-net

networks:
    smart-homie-net:

volumes:
    pg-data:
